version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/slskd.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: slskd
    source: ghcr.io/slskd/slskd
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    create_if_missing: true
    application:
      language: zh
      brief: "音乐共享下载"
      description: "slskd 是 Soulseek 的网页客户端：搜索并下载共享音乐，管理上传队列与好友列表。"
      keywords: "音乐, Soulseek, P2P, 下载, 共享"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
